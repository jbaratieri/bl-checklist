<svg width="320" height="960" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker orient="auto-start-reverse" markerHeight="5" markerWidth="5" refY="5" refX="5" viewBox="0 0 10 10" id="arrow-end-dark">
   <path id="svg_2" fill="#4a5568" d="m0,2l10,3l-10,3l0,-6z"/>
  </marker>
 </defs>
 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="960" width="320"/>
  <text id="svg_4" text-anchor="middle" fill="#4a3e3d" font-weight="bold" font-size="13px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="title-main" y="22" x="160">Raspagem e Nivelamento dos Filetes</text>
  <g id="svg_5">
   <rect id="svg_6" x="15" y="40" rx="6" stroke-width="1.2" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="210" width="290"/>
   <text id="svg_7" fill="#5c4f46" font-weight="bold" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-title" y="62" x="30">1) Direção: De Fora para Dentro</text>
   <g id="svg_8">
    <rect id="svg_9" stroke="#d0bba2" fill="#f1ddc4" class="wood-tapo-fundo" height="45" width="160" y="130" x="45"/>
    <rect id="svg_10" stroke-width="0.8" stroke="#3182ce" fill="#63b3ed" class="filete-sub" height="45" width="8" y="130" x="205"/>
    <rect id="svg_11" stroke-width="0.8" stroke="#e53e3e" fill="#fc8181" class="filete-capa" height="45" width="10" y="130" x="213"/>
    <polygon id="svg_12" fill-opacity="0.9" stroke="#718096" fill="#d1d5db" class="tool-blade" points="165,95 260,115 255,124 160,104 "/>
    <text id="svg_13" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-size="11px" class="text-label" y="122" x="180">Incline a lima</text>
    <path id="svg_14" fill="none" stroke-width="1.5" stroke="#4a5568" marker-end="url(#arrow-end-dark)" class="arrow-action" d="m240,110l-30,22"/>
   </g>
   <rect id="svg_15" rx="4" stroke-width="0.8" stroke="#dfd5c3" fill="#f7f1e6" class="badge-bg" height="26" width="260" y="210" x="30"/>
   <text id="svg_16" fill="#6b5b52" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor=" middle" class="text-label" y="226" x="160">Evita marcar a placa e "arrancar" fibras na quina.</text>
  </g>
  <g id="svg_17">
   <rect id="svg_18" x="15" y="265" rx="6" stroke-width="1.2" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="210" width="290"/>
   <text id="svg_19" fill="#5c4f46" font-weight="bold" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-title" y="287" x="30">2) Raspilha: Ângulo e Passes Curtos</text>
   <g id="svg_20">
    <rect id="svg_21" stroke="#d0bba2" fill="#f1ddc4" class="wood-tapo-fundo" height="20" width="170" y="360" x="55"/>
    <rect id="svg_22" stroke-width="0.8" stroke="#e53e3e" fill="#fc8181" class="filete-capa" height="25" width="12" y="355" x="225"/>
    <polygon id="svg_23" fill-opacity="0.9" stroke="#718096" fill="#d1d5db" class="tool-blade" points="130,345 227,337 229,352 132,360 "/>
    <path id="svg_24" fill="none" stroke="#d9534f" d="m125,360c0,-8 2,-12 5,-15"/>
    <text id="svg_25" font-weight="bold" font-size="11px" font-family="'Courier New', Courier, monospace" fill="#222222" class="text-num" y="341" x="137">≈ 5–10°</text>
    <path id="svg_26" fill="none" stroke-width="1.5" stroke="#4a5568" marker-end="url(#arrow-end-dark)" class="arrow-action" d="m165,328c15,-6 35,-6 50,0"/>
   </g>
   <rect id="svg_27" rx="4" stroke-width="0.8" stroke="#dfd5c3" fill="#f7f1e6" class="badge-bg" height="26" width="260" y="435" x="30"/>
   <text id="svg_28" fill="#6b5b52" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight=" bold" text-anchor=" middle" class="text-label" y="451" x="160">Raspe até "zerar" ao plano de forma controlada.</text>
  </g>
  <g id="svg_29">
   <rect id="svg_30" x="15" y="490" rx="6" stroke-width="1.2" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="210" width="290"/>
   <text id="svg_31" fill="#5c4f46" font-weight="bold" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-title" y="512" x="30">3) Laterais: Nivelar ao Plano</text>
   <g id="svg_32">
    <rect id="svg_33" stroke="#cbb096" fill="#e5c09f" class="wood-faixa" height="70" width="140" y="560" x="65"/>
    <rect id="svg_34" stroke-width="0.8" stroke="#3182ce" fill="#63b3ed" class="filete-sub" height="70" width="8" y="560" x="205"/>
    <rect id="svg_35" stroke-width="0.8" stroke="#e53e3e" fill="#fc8181" class="filete-capa" height="70" width="10" y="560" x="213"/>
    <polygon id="svg_36" fill-opacity="0.9" stroke="#718096" fill="#d1d5db" class="tool-blade" points="95,552 230,552 230,560 95,560 "/>
    <text id="svg_37" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11px" class="text-label" y="545" x="80">Melhor com raspilha ou lâmina de vidro</text>
   </g>
   <rect id="svg_38" rx="4" stroke-width="0.8" stroke="#dfd5c3" fill="#f7f1e6" class="badge-bg" height="26" width="260" y="660" x="30"/>
   <text id="svg_39" fill="#6b5b52" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor=" middle" class="text-label" y="676" x="160">Trabalhe por setores. Evite lixadeira orbital aqui.</text>
  </g>
  <g id="svg_40">
   <rect id="svg_41" x="15" y="715" rx="6" stroke-width="1.2" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="210" width="290"/>
   <text id="svg_42" fill="#5c4f46" font-weight="bold" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-title" y="737" x="30">4) Checagem de Altura &amp; Continuidade</text>
   <g id="svg_43">
    <path id="svg_44" rx="4" stroke-width="0.8" stroke="#38a169" fill="#c6f6d5" fill-opacity="0.15" class="badge-ok" d="m100,760l70,0c25,0 25,45 25,70l0,10l-95,0l0,-80z"/>
    <line id="svg_45" fill="none" stroke-dasharray="3,2" stroke-width="0.8" stroke="#a0aec0" class="line-guide" y2="800" x2="210" y1="800" x1="80"/>
    <line id="svg_46" fill="none" stroke-dasharray="3,2" stroke-width="0.8" stroke="#a0aec0" class="line-guide" y2="850" x2="145" y1="750" x1="145"/>
    <path id="svg_47" fill="none" stroke-width="2" stroke="#e53e3e" d="m100,758l70,0c28,0 28,47 28,72l0,10"/>
    <text id="svg_48" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight=" bold" class="text-label" y="790" x="110">Mesma Altura</text>
    <text id="svg_49" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11px" text-anchor=" middle" class="text-label" y="853" x="145">Continuidade 360°</text>
   </g>
   <rect id="svg_50" rx="4" stroke-width="0.8" stroke="#38a169" fill="#c6f6d5" class="badge-ok" height="26" width="260" y="885" x="30"/>
   <text transform="matrix(0.884598 0 0 1 19.4773 0)" stroke="null" id="svg_51" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight=" bold" text-anchor=" middle" class="text-label" y="901" x="160">Inspeção visual e tátil uniforme por toda a extensão.</text>
  </g>
 </g>
</svg>