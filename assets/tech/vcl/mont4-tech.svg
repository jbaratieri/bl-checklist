 <g>
  <title>Layer 1</title>
  <rect id="svg_4" fill="#fdfaf3" class="bg-canvas" height="750" width="900"/>
  <text id="svg_5" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="45" x="30">Inspeção Final Crítica — Controle de Qualidade e Geometria Estática</text>
