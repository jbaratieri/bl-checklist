   <g id="svg_10">
    <path id="svg_11" stroke="#c2996e" fill="#f4e8d1" opacity="0.5" class="wood-light" d="m174,305c-20,0 -30,-30 0,-50c20,-10 20,-30 35,-30l30,0c15,0 15,20 35,30c30,20 20,50 0,50l-100,0z"/>
