   <line id="svg_46" stroke-width="2.5" stroke="#2b7042" y2="540" x2="186" y1="540" x1="170"/>
   <text id="svg_47" font-weight="bold" fill="#2b7042" font-size="10px" class="text-ok" y="553" x="130">Contato 100% Plano</text>
   <circle id="svg_48" fill="#111111" r="5" cy="520" cx="310"/>
   <path id="svg_49" stroke-linecap="round" stroke="#222222" stroke-width="2" class="string-line" fill="none" d="m310,520l-40,0l-84,-45l-116,0"/>
   <path id="svg_50" stroke-dasharray="3,3" stroke-width="1.2" stroke="#d9534f" fill="none" d="m240,520c0,-15 -25,-30 -45,-40"/>
   <text id="svg_51" fill="#d9534f" font-weight="bold" font-size="11px" class="text-highlight" y="495" x="255">12° a 15° de Quebra</text>
   <text id="svg_52" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="595" x="232">A base do rastilho deve assentar de forma uniforme no fundo do
    <tspan id="svg_53" font-weight="bold">slot</tspan>,
    <tspan id="svg_54" dy="16" x="232">garantindo transferência mecânica integral e o correto vetor de força.</tspan></text>
  </g>
  <g id="svg_55">
   <rect id="svg_56" x="465" y="380" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="240" width="405"/>
   <text id="svg_57" fill="#5c5146" font-weight="bold" font-size="14px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="410" x="485">4) Inspeção Estrutural Interna (Boca)</text>
   <rect id="svg_58" stroke="#c2996e" fill="#f4e8d1" class="wood-light" height="16" width="310" y="510" x="515"/>
   <rect id="svg_59" stroke="#c8bca6" fill="#fdfaf3" height="16" width="110" y="510" x="615"/>
   <path id="svg_60" stroke-width="2" stroke="#787d82" d="m595,565l50,-40"/>
   <circle id="svg_61" stroke-width="1.5" stroke="#4a90e2" fill="#ffffff" r="10" cy="521" cx="650"/>
   <path id="svg_62" marker-end="url(#blue-arrow)" stroke-dasharray="3,3" stroke="#4a90e2" d="m650,521l35,39"/>
   <rect id="svg_63" stroke="#b59469" fill="#d2b48c" height="20" width="25" y="526" x="545"/>
   <text id="svg_64" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" class="text-label" y="560" x="557">Barras Firmes</text>
   <text id="svg_65" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="595" x="667">Utilize luz interna e espelho articulado para rastrear restos de cola,
    <tspan id="svg_66" dy="16" x="667">trincas ou barras harmônicas desconectadas após o estresse de tração.</tspan></text>
  </g>
