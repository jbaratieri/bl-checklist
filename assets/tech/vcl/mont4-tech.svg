    <rect id="svg_15" stroke="#111111" fill="#3d2b1f" class="wood-dark" rx="2" height="14" width="70" y="265" x="189"/>
    <rect id="svg_16" fill="#ffffff" height="3" width="50" y="269" x="199"/>
    <line id="svg_17" fill="none" stroke-dasharray="6,4" stroke-width="1.2" stroke="#4a90e2" class="axis-line" y2="325" x2="224" y1="110" x1="224"/>
    <path id="svg_18" marker-end="url(#blue-arrow)" stroke-width="1.2" stroke="#4a90e2" d="m184,145l20,0"/>
