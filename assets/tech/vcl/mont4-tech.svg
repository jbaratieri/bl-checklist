    <text transform="matrix(0.944815 0 0 0.988235 1.65556 7.52941)" stroke="null" id="svg_84" fill="#5c5146" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14px" class="text-step-title" y="687" x="750">Ficha Técnica Coberta</text>
   </g>
   <text transform="matrix(0.944815 0 0 0.988235 1.65556 7.52941)" stroke="null" id="svg_85" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style=" italic" fill="#6b5b52" font-size="12px" class="text-label" y="710" x="450">Para transportes de longa distância ou despacho aéreo, alivie aproximadamente ½ volta de tensão nas tarraxas para proteger a estrutura.</text>
