   </g>
   <g stroke="null" id="svg_73">
    <circle stroke="null" id="svg_74" fill="#2b7042" r="9.44815" cy="682.49412" cx="275.65182"/>
    <path stroke="#ffffff" id="svg_75" stroke-width="2" fill="none" d="m271.87256,682.49412l2.83444,2.96471l4.72407,-5.92941"/>
    <text transform="matrix(0.944815 0 0 0.988235 1.65556 7.52941)" stroke="null" id="svg_76" fill="#5c5146" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14px" class="text-step-title" y="687" x="310">Tap Test &amp; Acústica</text>
   </g>
   <g stroke="null" id="svg_77">
    <circle stroke="null" id="svg_78" fill="#2b7042" r="9.44815" cy="682.49412" cx="474.0629"/>
    <path stroke="#ffffff" id="svg_79" stroke-width="2" fill="none" d="m470.28364,682.49412l2.83444,2.96471l4.72407,-5.92941"/>
    <text transform="matrix(0.944815 0 0 0.988235 1.65556 7.52941)" stroke="null" id="svg_80" fill="#5c5146" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14px" class="text-step-title" y="687" x="520">Luz Rasante (Acabamento)</text>
   </g>
   <g stroke="null" id="svg_81">
    <circle stroke="null" id="svg_82" fill="#2b7042" r="9.44815" cy="682.49412" cx="691.37028"/>
