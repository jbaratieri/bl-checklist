   <text id="svg_21" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="325" x="232">O braço deve estar perfeitamente
    <tspan id="svg_22" font-weight="bold" fill="#2b7042" class="text-ok">co-linear</tspan>ao eixo simétrico do corpo,
    <tspan id="svg_23" dy="16" x="232">alinhando a roseta, a escala, a pestana e o centro do cavalete.</tspan></text>
  </g>
