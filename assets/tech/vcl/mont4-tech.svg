   <text id="svg_39" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="325" x="667">Valide as alturas finais sob o ambiente de umidade controlada
    <tspan id="svg_40" dy="16" x="667">(45–55% UR) antes de prosseguir para a vedação da ficha.</tspan></text>
  </g>
  <g id="svg_41">
