   <g id="svg_35">
    <line id="svg_36" stroke-linecap="round" stroke-width="2" stroke="#222222" fill="none" class="string-line" y2="209" x2="845" y1="209" x1="625"/>
    <line id="svg_37" fill="none" stroke-width="1.2" stroke="#d9534f" marker-end="url(#arrow-end)" marker-start="url(#arrow-start)" class="dimension-line" y2="210" x2="745" y1="224" x1="745"/>
    <text id="svg_38" fill="#d9534f" font-weight="bold" font-size="11px" class="text-highlight" y="226" x="788">Ação na 12ª</text>
