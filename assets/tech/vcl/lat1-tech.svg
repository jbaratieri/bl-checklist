<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Segoe UI,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="woodgr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8923a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8a5a1e" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="woodgr2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b07830" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7a4a18" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="metalg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aabb8"/>
      <stop offset="100%" stop-color="#c8d4dc"/>
    </linearGradient>
    <linearGradient id="bladeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a0b0c0"/>
      <stop offset="100%" stop-color="#d0dce8"/>
    </linearGradient>
  </defs>

  <!-- fundo geral -->
  <rect width="680" height="820" fill="#faf8f4"/>

  <!-- ═══════════════════════════════════════════════════
       ETAPA 1 — Pareamento bookmatch
  ════════════════════════════════════════════════════ -->
  <rect x="20" y="20" width="640" height="172" rx="10" fill="#f0ece2" stroke="#c8b596" stroke-width="1"/>
  <!-- badge -->
  <rect x="28" y="28" width="22" height="22" rx="11" fill="#BA7517"/>
  <text x="39" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#FAEEDA">1</text>
  <text x="59" y="43" font-size="13" font-weight="700" fill="#2c2a22">Pareamento em livro (bookmatch)</text>

  <!-- Faixa A -->
  <rect x="60" y="58" width="230" height="42" rx="4" fill="url(#woodgr)" stroke="#b07830" stroke-width="1"/>
  <path d="M80,62 Q110,70 140,64 Q170,58 200,66 Q220,70 240,64" fill="none" stroke="#8a5a1e" stroke-width="1.2" opacity="0.6"/>
  <path d="M80,72 Q112,79 145,73 Q175,67 205,74 Q225,78 244,72" fill="none" stroke="#8a5a1e" stroke-width="1" opacity="0.45"/>
  <path d="M80,82 Q115,88 148,83 Q178,77 210,83 Q230,86 244,82" fill="none" stroke="#8a5a1e" stroke-width="0.9" opacity="0.35"/>
  <text x="175" y="84" text-anchor="middle" font-size="10" fill="#5a3a10">Faixa A</text>

  <!-- Faixa B espelhada -->
  <rect x="60" y="108" width="230" height="42" rx="4" fill="url(#woodgr2)" stroke="#b07830" stroke-width="1"/>
  <path d="M244,112 Q214,120 184,114 Q154,108 124,116 Q104,120 80,114" fill="none" stroke="#8a5a1e" stroke-width="1.2" opacity="0.6"/>
  <path d="M244,122 Q212,129 179,123 Q149,117 119,124 Q99,128 80,122" fill="none" stroke="#8a5a1e" stroke-width="1" opacity="0.45"/>
  <path d="M244,132 Q209,138 176,133 Q146,127 114,133 Q94,136 80,132" fill="none" stroke="#8a5a1e" stroke-width="0.9" opacity="0.35"/>
  <text x="175" y="146" text-anchor="middle" font-size="10" fill="#5a3a10">Faixa B (espelhada)</text>

  <!-- seta alinhamento -->
  <path d="M175,102 L175,108" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- bordo azul referência -->
  <rect x="58" y="56" width="4" height="96" rx="2" fill="#185FA5" opacity="0.8"/>

  <!-- anotações direita -->
  <text x="298" y="78" font-size="11" fill="#444">veios espelhados "em livro"</text>
  <line x1="293" y1="80" x2="244" y2="80" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3 2"/>
  <text x="298" y="118" font-size="11" fill="#185FA5">bordo reto de referência</text>
  <line x1="293" y1="114" x2="66" y2="104" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3 2"/>

  <!-- nota rodapé e1 -->
  <rect x="28" y="160" width="624" height="22" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="175" font-size="10" fill="#666">Alinhe as fibras visualmente e rectifique o bordo escolhido antes de marcar. Mantenha as duas peças presas juntas durante todo o processo.</text>

  <!-- ═══════════════════════════════════════════════════
       ETAPA 2 — Larguras e comprimento
  ════════════════════════════════════════════════════ -->
  <rect x="20" y="204" width="640" height="188" rx="10" fill="#f0ece2" stroke="#c8b596" stroke-width="1"/>
  <rect x="28" y="212" width="22" height="22" rx="11" fill="#0F6E56"/>
  <text x="39" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#E1F5EE">2</text>
  <text x="59" y="227" font-size="13" font-weight="700" fill="#2c2a22">Larguras e comprimento — marcação antes do corte</text>

  <!-- faixa representando o costado inteiro -->
  <rect x="38" y="250" width="524" height="55" rx="3" fill="url(#woodgr)" stroke="#b07830" stroke-width="0.8"/>
  <path d="M60,255 Q180,261 300,256 Q420,251 540,257" fill="none" stroke="#8a5a1e" stroke-width="0.9" opacity="0.4"/>
  <path d="M60,268 Q180,273 300,269 Q420,264 540,270" fill="none" stroke="#8a5a1e" stroke-width="0.8" opacity="0.3"/>
  <path d="M60,282 Q200,286 330,282 Q450,277 540,282" fill="none" stroke="#8a5a1e" stroke-width="0.7" opacity="0.25"/>
  <path d="M60,295 Q200,298 340,295 Q460,291 540,295" fill="none" stroke="#8a5a1e" stroke-width="0.6" opacity="0.2"/>

  <!-- cota braço -->
  <line x1="38" y1="242" x2="38" y2="249" stroke="#185FA5" stroke-width="1"/>
  <line x1="38" y1="244" x2="113" y2="244" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="113" y1="250" x2="113" y2="244" stroke="#185FA5" stroke-width="0.8"/>
  <text x="75" y="239" text-anchor="middle" font-size="10" fill="#185FA5">90–95 mm</text>
  <text x="75" y="228" text-anchor="middle" font-size="10" fill="#444">(braço)</text>

  <!-- cota culatra -->
  <line x1="562" y1="242" x2="562" y2="249" stroke="#185FA5" stroke-width="1"/>
  <line x1="487" y1="244" x2="562" y2="244" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="487" y1="250" x2="487" y2="244" stroke="#185FA5" stroke-width="0.8"/>
  <text x="524" y="239" text-anchor="middle" font-size="10" fill="#185FA5">95–100 mm</text>
  <text x="524" y="228" text-anchor="middle" font-size="10" fill="#444">(culatra)</text>

  <!-- cota comprimento -->
  <line x1="38" y1="313" x2="38" y2="318" stroke="#0F6E56" stroke-width="1"/>
  <line x1="38" y1="315" x2="562" y2="315" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="562" y1="313" x2="562" y2="318" stroke="#0F6E56" stroke-width="1"/>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#085041">≈ 850 mm — comprimento típico (violão clássico)</text>

  <!-- marcas folga -->
  <line x1="38" y1="248" x2="38" y2="308" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7"/>
  <line x1="562" y1="248" x2="562" y2="308" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7"/>
  <text x="598" y="278" font-size="10" fill="#633806">+2–3 mm</text>
  <text x="598" y="290" font-size="10" fill="#633806">folga</text>

  <!-- nota e2 -->
  <rect x="28" y="342" width="624" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="358" font-size="10" fill="#666">Medidas para violão clássico. Consulte a plantilla do instrumento que está construindo. Deixe sempre</text>
  <text x="40" y="374" font-size="10" fill="#666">2–3 mm de folga nas bordas para acerto pós-dobra. Verifique retidão contra a luz com régua metálica.</text>

  <!-- ═══════════════════════════════════════════════════
       ETAPA 3 — Corte longitudinal
  ════════════════════════════════════════════════════ -->
  <rect x="20" y="404" width="640" height="188" rx="10" fill="#f0ece2" stroke="#c8b596" stroke-width="1"/>
  <rect x="28" y="412" width="22" height="22" rx="11" fill="#993C1D"/>
  <text x="39" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#FAECE7">3</text>
  <text x="59" y="427" font-size="13" font-weight="700" fill="#2c2a22">Corte longitudinal manual</text>

  <!-- mesa -->
  <rect x="30" y="500" width="590" height="12" rx="3" fill="#ccc" opacity="0.4"/>

  <!-- batente -->
  <rect x="50" y="448" width="10" height="54" rx="3" fill="url(#metalg)"/>
  <rect x="51" y="449" width="8" height="52" rx="2" fill="none" stroke="#8899aa" stroke-width="0.5"/>
  <text x="38" y="460" text-anchor="middle" font-size="10" fill="#444">régua</text>
  <text x="38" y="472" text-anchor="middle" font-size="10" fill="#444">batente</text>

  <!-- peça a cortar -->
  <rect x="62" y="455" width="370" height="42" rx="3" fill="url(#woodgr)" stroke="#b07830" stroke-width="0.8"/>
  <path d="M80,460 Q150,466 230,461 Q310,456 370,462" fill="none" stroke="#8a5a1e" stroke-width="0.9" opacity="0.4"/>
  <path d="M80,472 Q155,477 240,472 Q320,467 370,473" fill="none" stroke="#8a5a1e" stroke-width="0.8" opacity="0.3"/>
  <path d="M80,484 Q160,488 250,483 Q330,478 370,484" fill="none" stroke="#8a5a1e" stroke-width="0.7" opacity="0.25"/>

  <!-- excedente -->
  <rect x="432" y="455" width="148" height="42" rx="3" fill="#e0ddd5" opacity="0.5" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text x="506" y="480" text-anchor="middle" font-size="10" fill="#888">excedente</text>

  <!-- linha de corte -->
  <line x1="432" y1="448" x2="432" y2="500" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="432" y="444" text-anchor="middle" font-size="10" fill="#633806">linha de corte</text>

  <!-- serrote -->
  <rect x="400" y="488" width="55" height="8" rx="2" fill="url(#bladeg)" stroke="#8899aa" stroke-width="0.5"/>
  <path d="M455,488 Q472,482 475,492 Q478,500 455,496 Z" fill="#b07830" stroke="#8a5a1e" stroke-width="0.5"/>
  <path d="M402,496 L407,488 L412,496 L417,488 L422,496 L427,488 L432,496 L437,488 L442,496 L447,488 L452,496" fill="none" stroke="#8899aa" stroke-width="0.5"/>
  <text x="430" y="516" text-anchor="middle" font-size="10" fill="#555">serrote curvo (ou tico-tico)</text>

  <!-- seta avanço -->
  <path d="M410,472 L372,472" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="388" y="467" text-anchor="middle" font-size="10" fill="#993C1D">passes leves</text>

  <!-- grampo -->
  <rect x="30" y="453" width="22" height="50" rx="3" fill="none" stroke="#185FA5" stroke-width="1.5"/>
  <rect x="30" y="453" width="22" height="8" rx="2" fill="#185FA5" opacity="0.6"/>
  <rect x="30" y="495" width="22" height="8" rx="2" fill="#185FA5" opacity="0.6"/>
  <text x="16" y="484" font-size="10" fill="#185FA5" text-anchor="middle">grampo</text>

  <!-- nota e3 -->
  <rect x="28" y="542" width="624" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="558" font-size="10" fill="#666">Prenda as peças com grampos e use a régua/batente como guia. Faça passes leves repetidos — nunca force o serrote.</text>
  <text x="40" y="574" font-size="10" fill="#666">Coloque um sarrafo de proteção ao longo da peça para evitar flexão e quebras.</text>

  <!-- ═══════════════════════════════════════════════════
       ETAPA 4 — Calibragem
  ════════════════════════════════════════════════════ -->
  <rect x="20" y="604" width="640" height="196" rx="10" fill="#f0ece2" stroke="#c8b596" stroke-width="1"/>
  <rect x="28" y="612" width="22" height="22" rx="11" fill="#3C3489"/>
  <text x="39" y="627" text-anchor="middle" font-size="12" font-weight="700" fill="#EEEDFE">4</text>
  <text x="59" y="627" font-size="13" font-weight="700" fill="#2c2a22">Calibragem da espessura</text>

  <!-- peça (vista lateral) -->
  <rect x="60" y="648" width="350" height="36" rx="3" fill="url(#woodgr)" stroke="#b07830" stroke-width="0.8"/>
  <path d="M80,653 Q160,658 240,654 Q310,650 380,655" fill="none" stroke="#8a5a1e" stroke-width="0.9" opacity="0.35"/>
  <path d="M80,664 Q165,668 250,664 Q320,660 380,664" fill="none" stroke="#8a5a1e" stroke-width="0.7" opacity="0.25"/>
  <path d="M80,675 Q170,678 260,674 Q335,670 380,674" fill="none" stroke="#8a5a1e" stroke-width="0.6" opacity="0.2"/>

  <!-- pontos calibrador -->
  <circle cx="110" cy="648" r="3" fill="#3C3489" opacity="0.85"/>
  <circle cx="175" cy="648" r="3" fill="#3C3489" opacity="0.85"/>
  <circle cx="240" cy="648" r="3" fill="#3C3489" opacity="0.85"/>
  <circle cx="305" cy="648" r="3" fill="#3C3489" opacity="0.85"/>
  <circle cx="370" cy="648" r="3" fill="#3C3489" opacity="0.85"/>
  <text x="240" y="638" text-anchor="middle" font-size="10" fill="#3C3489">pontos de profundidade do calibrador</text>

  <!-- plaina -->
  <rect x="130" y="684" width="105" height="22" rx="4" fill="url(#bladeg)" stroke="#8899aa" stroke-width="0.8"/>
  <rect x="130" y="684" width="25" height="22" rx="4" fill="#b07830" opacity="0.7"/>
  <path d="M150,700 L170,700 L160,706 Z" fill="#8899aa"/>
  <path d="M218,684 Q236,678 240,690 Q244,700 236,706 Q234,686 218,706 Z" fill="#b07830" opacity="0.7"/>
  <text x="182" y="720" text-anchor="middle" font-size="10" fill="#555">plaina de mão</text>

  <!-- seta sentido -->
  <path d="M235,695 L295,695" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="340" y="691" font-size="10" fill="#993C1D">sentido de trabalho</text>
  <text x="340" y="703" font-size="10" fill="#993C1D">(contra o grampo)</text>

  <!-- sequência plaina → raspilha → lixa -->
  <rect x="420" y="648" width="70" height="28" rx="5" fill="#fff" stroke="#3C3489" stroke-width="0.8"/>
  <text x="455" y="666" text-anchor="middle" font-size="10" fill="#3C3489">plaina</text>
  <path d="M491,662 L504,662" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <rect x="505" y="648" width="70" height="28" rx="5" fill="#fff" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="540" y="666" text-anchor="middle" font-size="10" fill="#0F6E56">raspilha</text>
  <path d="M576,662 L589,662" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)"/>
  <rect x="590" y="648" width="55" height="28" rx="5" fill="#fff" stroke="#BA7517" stroke-width="0.8"/>
  <text x="617" y="666" text-anchor="middle" font-size="10" fill="#BA7517">lixa plana</text>
  <text x="535" y="692" text-anchor="middle" font-size="10" fill="#555">sequência de acabamento</text>

  <!-- cota espessura lateral -->
  <line x1="52" y1="648" x2="52" y2="684" stroke="#BA7517" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="42" y="672" text-anchor="middle" font-size="10" fill="#633806" transform="rotate(-90 42 672)">1,7–2,0 mm</text>

  <!-- nota e4 -->
  <rect x="28" y="740" width="624" height="60" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="756" font-size="10" fill="#666">Ferro da plaina baixo e bem afiado — uma plaina cega amassa em vez de cortar. Use passes leves e cruzados.</text>
  <text x="40" y="771" font-size="10" fill="#666">Verifique com calibrador em vários pontos. Evite desengrossadeira automática — risco alto em peças finas.</text>
  <text x="40" y="786" font-size="10" fill="#666">Prefira lixadeira calibradora de painéis se disponível. Espessura-alvo violão clássico: 1,7–2,0 mm.</text>
</svg>
