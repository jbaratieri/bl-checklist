<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1000" width="100%" height="100%">
  <defs>
    <style>
      /* Canvas e Pranchetas */
      .bg-canvas { fill: #fdfaf3; }
      .bg-panel { fill: #ffffff; stroke: #c8bca6; stroke-width: 1.2; rx: 6; }
      
      /* Tipografia Técnica Otimizada para Telas Pequenas */
      .title-main { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #4a3e3d; text-anchor: middle; }
      .text-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #5c4f46; }
      .text-label { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11px; fill: #6b5b52; }
      .text-num { font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; fill: #222222; }
      
      /* Madeiras e Componentes */
      .wood-tampo { fill: #f1ddc4; stroke: #d0bba2; stroke-width: 1; }
      .wood-caibro { fill: #d2a172; stroke: #b07d50; stroke-width: 1; }
      .roseta-ring { fill: #a67c52; stroke: #5c4033; stroke-width: 1; }
      
      /* Linhas de Cota e Guias */
      .line-dimension { stroke: #d9534f; stroke-width: 1.2; fill: none; }
      .line-axis { stroke: #4a90e2; stroke-width: 1; stroke-dasharray: 4,3; fill: none; }
      .line-guide { stroke: #bcae97; stroke-width: 0.8; stroke-dasharray: 3,2; fill: none; }
      .arrow-action { stroke: #2b7042; stroke-width: 1.5; fill: none; }
      .badge-bg { fill: #f7f1e6; stroke: #dfd5c3; stroke-width: 0.8; rx: 4; }
    </style>
    
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 z" fill="#d9534f"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#d9534f"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#2b7042"/>
    </marker>
  </defs>

  <rect width="320" height="1000" class="bg-canvas" />
  <text x="160" y="25" class="title-main">Incrustação Passo a Passo da Roseta</text>

  <g transform="translate(15, 45)">
    <rect width="290" height="215" class="bg-panel" />
    <text x="15" y="22" class="text-title">1) Marcação Geométrica &amp; Pivô</text>
    
    <g transform="translate(45, 40)">
      <rect width="200" height="120" class="wood-tampo" />
      <line x1="100" y1="-10" x2="100" y2="130" class="line-axis" />
      <line x1="-10" y1="60" x2="210" y2="60" class="line-axis" />
      <circle cx="100" cy="60" r="40" class="line-guide" />
      <circle cx="100" cy="60" r="28" class="line-guide" />
      <circle cx="100" cy="60" r="3" fill="#d9534f" />
      
      <path d="M 100 60 L 150 25" class="line-dimension" marker-end="url(#arrow-end)" />
      <text x="155" y="23" class="text-num" style="fill: #d9534f;">Ø 4 mm</text>
      <text x="155" y="36" class="text-label" style="font-size: 10px;">Furo Guia</text>
    </g>
    
    <rect x="15" y="175" width="260" height="24" class="badge-bg" />
    <text x="145" y="191" class="text-label" style="text-anchor: middle;">Marque os limites com base no centro rígido.</text>
  </g>

  <g transform="translate(15, 280)">
    <rect width="290" height="215" class="bg-panel" />
    <text x="15" y="22" class="text-title">2) Escavação do Canal (Tupia/Manual)</text>
    
    <g transform="translate(45, 40)">
      <rect width="200" height="120" class="wood-tampo" />
      <circle cx="100" cy="60" r="34" stroke="#b09c85" stroke-width="12" fill="none" opacity="0.3"/>
      
      <line x1="100" y1="60" x2="145" y2="30" stroke="#7f8c8d" stroke-width="4" />
      <rect x="135" y="15" width="16" height="20" fill="#34495e" rx="1" />
      <circle cx="100" cy="60" r="2.5" fill="#4a90e2" />
      
      <path d="M 140 5 C 160 20, 165 40, 155 55" class="arrow-action" marker-end="url(#green-arrow)" />
      <text x="165" y="25" class="text-label" style="fill: #2b7042; font-weight: bold; font-size: 10px;">Giro</text>
    </g>

    <rect x="15" y="175" width="260" height="24" class="badge-bg" />
    <text x="145" y="191" class="text-label" style="text-anchor: middle; font-weight: bold;">Profundidade do rebaixo: 1.5 mm</text>
  </g>

  <g transform="translate(15, 515)">
    <rect width="290" height="215" class="bg-panel" />
    <text x="15" y="22" class="text-title">3) Assentamento da Roseta &amp; Cola</text>
    
    <g transform="translate(45, 40)">
      <rect width="200" height="120" class="wood-tampo" />
      <circle cx="100" cy="60" r="34" stroke="#a67c52" stroke-width="10" fill="none" />
      <circle cx="100" cy="60" r="39" stroke="#5c4033" stroke-width="1" fill="none" />
      <circle cx="100" cy="60" r="29" stroke="#5c4033" stroke-width="1" fill="none" />
      
      <path d="M 35 100 L 15 115" stroke="#dfb17b" stroke-width="1" marker-start="url(#arrow-start)" />
      <text x="10" y="128" class="text-label" style="fill:#b5824c; font-size:10px;">Filme de cola alifática</text>
    </g>

    <rect x="15" y="175" width="260" height="24" class="badge-bg" />
    <text x="145" y="191" class="text-label" style="text-anchor: middle;">Remova imediatamente o excesso expelido.</text>
  </g>

  <g transform="translate(15, 750)">
    <rect width="290" height="215" class="bg-panel" />
    <text x="15" y="22" class="text-title">4) Prensa de Face Plana (Corte)</text>
    
    <g transform="translate(35, 50)">
      <rect x="10" y="45" width="200" height="18" class="wood-tampo" />
      
      <rect x="35" y="45" width="25" height="8" fill="#ffffff" stroke="#d0bba2" />
      <rect x="150" y="45" width="25" height="8" fill="#ffffff" stroke="#d0bba2" />
      <rect x="36" y="39" width="23" height="14" class="roseta-ring" />
      <rect x="151" y="39" width="23" height="14" class="roseta-ring" />

      <rect x="20" y="12" width="180" height="16" class="wood-caibro" opacity="0.85" />
      <line x1="20" y1="34" x2="200" y2="34" stroke="#4a90e2" stroke-width="1.5" />
      
      <path d="M 60 -8 L 60 4" class="line-dimension" stroke="#4a90e2" marker-end="url(#arrow-end)" />
      <path d="M 150 -8 L 150 4" class="line-dimension" stroke="#4a90e2" marker-end="url(#arrow-end)" />
      
      <path d="M 216 45 L 216 53" class="line-dimension" />
      <line x1="212" y1="49" x2="222" y2="49" class="line-dimension" />
      <text x="226" y="52" class="text-num" style="fill:#d9534f; font-size: 10px;">1.5 mm</text>
    </g>

    <text x="45" y="132" class="text-label" style="font-size: 9px; fill: #4a90e2;">[Papel antiaderente protetor]</text>

    <rect x="15" y="175" width="260" height="24" class="badge-bg" />
    <text x="145" y="191" class="text-label" style="text-anchor: middle; font-weight: bold; fill:#2b7042;">Período total de cura: 24 horas</text>
  </g>
</svg>
