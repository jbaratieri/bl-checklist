   <rect stroke="#f0ad4e" id="svg_35" rx="4" fill="#fff7eb" height="45" width="166" y="195" x="700"/>
   <text id="svg_36" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="213" x="785">PROFUNDIDADE: ~4mm</text>
   <text id="svg_37" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-size="12px" class="text-label" y="232" x="784">Fundo plano garante o som</text>
   <text id="svg_38" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="310" x="810">
