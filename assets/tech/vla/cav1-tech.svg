  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Preparação do Cavalete — Usinagem &amp; Ajuste Manual</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text transform="matrix(0.850782 0 0 1.14857 6.71482 -8.7527)" stroke="null" id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Nota técnica: Gráficos baseados nas proporções de um Violão Clássico. Para Cavaquinho, Viola ou Ukulele, consulte as medidas exatas nos textos e alertas abaixo.</text>
  <g id="svg_7">
   <rect id="svg_8" x="37" y="94" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="51">1) Zonas do Blank (20 x 10 mm)</text>
   <g id="svg_10">
    <path id="svg_11" stroke-width="1.2" stroke="#150b05" fill="#2c1e15" class="wood-ebony" d="m86,245l50,0l0,-20l-50,15l0,5z"/>
