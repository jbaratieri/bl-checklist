   <text id="svg_53" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="477" x="230">~11 mm (Clássico)</text>
   <g id="svg_54">
    <path id="svg_55" stroke-width="1.2" stroke="#78828c" fill="#b0b8c0" class="metal-tool" d="m113,548l15,-10l15,10l-30,0z"/>
    <text transform="matrix(1.29849 0 0 1 -46.8533 0)" stroke="null" id="svg_56" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="548" x="229">Escarear bordas internas</text>
   </g>
   <text id="svg_57" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="603" x="364">
    <tspan id="svg_58" dy="0" x="222">Fure com precisão usando broca guia fina.</tspan>
    <tspan id="svg_59" dy="16" x="222">
     <tspan id="svg_60" font-weight="bold" fill="#d9534f" class="text-highlight">Quebre as quinas</tspan>dos furos para poupar e não romper as cordas.</tspan>
   </text>
  </g>
  <g id="svg_61">
   <rect id="svg_62" x="465" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_63" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="485">4) Ajuste de Contato Total ao Tampo</text>
   <path id="svg_64" stroke-width="6" stroke="#c2996e" fill="none" d="m505,565q160,-25 320,0"/>
