    <text id="svg_19" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="260" x="166">Lomo</text>
    <text id="svg_20" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" class="text-label" y="260" x="216">Valle</text>
    <text id="svg_21" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="260" x="276">Meseta</text>
    <text id="svg_22" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" class="text-label" y="260" x="341">Aleta</text>
   </g>
   <text id="svg_23" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="318" x="389">
    <tspan id="svg_24" dy="0" x="232">Esquadre o blank de madeira nobre perfeitamente.</tspan>
    <tspan id="svg_25" dy="16" x="232">Risque os limites anatômicos antes de iniciar os rebajes.</tspan>
   </text>
  </g>
  <g id="svg_26">
