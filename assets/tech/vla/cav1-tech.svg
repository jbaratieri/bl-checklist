   <line id="svg_32" fill="#d9534f" stroke-width="1.5" stroke="#d9534f" marker-end="url(#arrow-alert)" marker-start="url(#arrow-alert)" class="seta-alerta" y2="207" x2="670" y1="207" x1="685"/>
   <line id="svg_33" stroke-linecap="round" fill="#5c5146" stroke-width="1.8" stroke="#5c5146" marker-end="url(#arrow-action)" marker-start="url(#arrow-action)" class="seta-ação" y2="170" x2="670" y1="170" x1="650"/>
