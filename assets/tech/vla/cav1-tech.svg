   <text id="svg_72" text-anchor="middle" fill="#ffffff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="11px" class="text-badge" y="479" x="775">Sumiço da Grafite = OK</text>
   <text id="svg_73" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="611" x="816">
    <tspan id="svg_74" dy="0" x="669">Pinte a base com grafite e use o taco espelho do raio.</tspan>
    <tspan id="svg_75" dy="16" x="669">Só efetue a colagem quando o assentamento for 100% perfeito.</tspan>
   </text>
