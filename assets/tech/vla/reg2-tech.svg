   <text id="svg_21" fill="#222222" font-weight="bold" font-size="11px" font-family="'Courier New', Courier, monospace" class="text-num" y="271" x="60">Se
    <tspan id="svg_22" font-weight="bold" fill="#d9534f" class="text-high">Frettada &gt; Harmônico</tspan>→ Nota está ALTA (Encurtar)</text>
   <text id="svg_23" fill="#222222" font-weight="bold" font-size="11px" font-family="'Courier New', Courier, monospace" class="text-num" y="287" x="60">Se
    <tspan id="svg_24" font-weight="bold" fill="#337ab7" class="text-low">Frettada &lt; Harmônico</tspan>→ Nota está BAIXA (Alongar)</text>
