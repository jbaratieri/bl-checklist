   <text id="svg_45" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11px" class="text-label" y="315" x="480">para eliminar ruídos parasitários e problemas de vibração de corda.</text>
