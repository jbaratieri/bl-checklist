    <path id="svg_19" opacity="0.3" fill="#2d1e16" class="pore-open" d="m270.62538,156q4.98105,20 9.9621,0l-9.9621,0zm39.84839,0q4.98105,22 9.9621,0l-9.9621,0zm39.84839,0q4.98105,20 9.9621,0l-9.9621,0zm24.90525,0q4.98105,18 9.9621,0l-9.9621,0z" stroke="null"/>
    <text id="svg_20" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-size="12px" font-weight="bold" class="text-label" y="218" x="325" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">Fundo (Jacarandá/Mogno)</text>
    <text id="svg_21" font-weight="bold" fill="#d9534f" font-size="10px" class="text-highlight" y="232" x="264" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">Exige Pore Fill Obligatório</text>
   </g>
   <rect id="svg_22" rx="4" fill="#fcfaf2" height="26" width="323.76819" y="256" x="71.38342" stroke="#c8bca6"/>
   <text id="svg_23" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="273" x="232" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">Guitarra Flamenca (Cipreste): Poro fino, fill dispensável.</text>
   <text id="svg_24" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="311" x="394.61632" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">
    <tspan id="svg_25" dy="0" x="232.61632" stroke="null">Não sature o tampo harmônico com massas pesadas.</tspan>
    <tspan id="svg_26" dy="16" x="232.61632" stroke="null">O excesso de resina amortece a vibração acústica do tampo.</tspan>
   </text>
