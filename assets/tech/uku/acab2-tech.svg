    <text id="svg_16" font-weight="bold" fill="#2b7042" font-size="10px" class="text-ok" y="232" x="81" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">Apenas Seladora Leve</text>
   </g>
