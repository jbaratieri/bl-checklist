   <text id="svg_58" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="485">4) Patologias de Oficina (Erros Comuns)</text>
