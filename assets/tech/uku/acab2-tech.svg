    <rect id="svg_49" stroke-width="1.2" stroke="#f0ad4e" fill-opacity="0.4" fill="#f0ad4e" class="layer-shellac" height="15" width="300" y="479" x="80"/>
    <text id="svg_50" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="490" x="230">GOMA-LACA DESCERADA (Dewaxed)</text>
    <rect id="svg_51" stroke-width="1.2" stroke="#46b8da" fill-opacity="0.3" fill="#5bc0de" class="layer-topcoat" height="23" width="300" y="455" x="80"/>
    <text id="svg_52" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="470" x="230">Verniz Final (Verniz de topo: Nitro / PU)</text>
   </g>
   <text id="svg_53" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="603" x="390">
    <tspan id="svg_54" dy="0" x="228">A goma-laca descerada funciona como ponte química universal.</tspan>
    <tspan id="svg_55" dy="16" x="228">Impede rejeição de aderência ou incompatibilidade mecânica.</tspan>
   </text>
  </g>
