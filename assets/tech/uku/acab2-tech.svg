 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Seladora e Pore Fill — Estrutura de Poros, Métodos e Selagem Intermediária</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Nota acústica: Tampos (Abeto/Cedro) pedem selagem mínima. Pore fill agressivo é restrito às madeiras de poro aberto (Jacarandá/Mogno).</text>
  <g id="svg_7" stroke="null">
   <rect id="svg_8" x="31.53503" y="96" rx="8" stroke-width="1.5" fill="#ffffff" class="bg-panel" height="260" width="403.46497" stroke="#c8bca6"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="126" x="50" stroke="null" transform="matrix(0.99621 0 0 1 1.64874 0)">1) Anatomia da Madeira e Alvos de Aplicação</text>
   <g id="svg_10" stroke="null">
    <rect id="svg_11" x="65.40616" y="157" fill="#f9ebd2" class="abeto-tampo" height="45" width="139.46937" stroke="#dfb17b"/>
