    <path id="svg_60" stroke-width="1.5" stroke="#d9534f" fill="#e6b8b8" d="m505,485q40,-25 80,0q40,25 80,0q40,-25 80,0q40,25 80,0l0,30l-320,0l0,-30z"/>
