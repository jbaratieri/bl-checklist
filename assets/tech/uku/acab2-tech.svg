    <text id="svg_65" fill="#d9534f" text-anchor="middle" font-weight="bold" font-size="11px" class="text-highlight" y="505" x="665">Película Irregular &amp; Incompatibilidade Química</text>
   </g>
   <text id="svg_66" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="540" x="667">Massa grossa mal nivelada gera efeito ondulado ("ondas").</text>
   <text id="svg_67" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="602" x="819">
    <tspan id="svg_68" dy="0" x="662">Lixe o filler até que reste material apenas nos poros.</tspan>
    <tspan id="svg_69" dy="16" x="662">Toda a superfície externa da madeira deve ser limpa antes de selar.</tspan>
   </text>
