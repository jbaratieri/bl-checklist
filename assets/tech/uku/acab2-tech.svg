    <text id="svg_38" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="149" x="577">Movimento Cruzado</text>
   </g>
   <text id="svg_39" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="314" x="826">
    <tspan id="svg_40" dy="0" x="669">Force o filler / epóxi para dentro dos canais da fibra.</tspan>
    <tspan id="svg_41" dy="16" x="669">Trabalhar paralelo ao veio remove o material de dentro dos poros.</tspan>
   </text>
  </g>
  <g id="svg_42">
