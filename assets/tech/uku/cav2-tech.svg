   <rect id="svg_24" stroke="#261a13" fill="#3d2b1f" class="wood-dark" height="30" width="60" y="140" x="637"/>
   <line id="svg_25" stroke-dasharray="4,4" stroke="#555555" class="linha-escala" y2="290" x2="667" y1="170" x1="667"/>
   <text id="svg_26" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="12px" class="text-label" y="210" x="610">Escala Nominal</text>
   <line transform="rotate(-6.88816 665 260)" id="svg_27" stroke-width="2" stroke="#d9534f" y2="265" x2="755" y1="255" x1="575"/>
   <text id="svg_28" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="247" x="715">Linha da Selleta</text>
   <line id="svg_29" stroke-width="0.8" stroke="#555" y2="265" x2="667" y1="260" x1="667"/>
   <line id="svg_30" stroke-width="0.8" stroke="#555" y2="265" x2="745" y1="260" x1="745"/>
   <line transform="rotate(-5.22943 625 270)" id="svg_31" fill="#d9534f" stroke-width="1.5" stroke="#d9534f" marker-end="url(#arrow-alert)" marker-start="url(#arrow-alert)" class="seta-alerta" y2="270" x2="586" y1="270" x1="664"/>
   <text transform="rotate(-5.92155 629 280.6)" id="svg_32" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="285" x="629">+ Graves</text>
   <text id="svg_33" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="323" x="808">
    <tspan id="svg_34" dy="0" x="651">Adicione o recuo milimétrico (offset) no rastilho.</tspan>
    <tspan id="svg_35" dy="16" x="651">A inclinação compensa a tensão extra das cordas graves.</tspan>
   </text>
  </g>
  <g id="svg_36">
   <rect id="svg_37" x="30" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_38" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="50">3) Simulação de Linha das Cordas</text>
   <path id="svg_39" opacity="0.4" stroke="#c8bca6" fill="#fff7eb" d="m190,430l84,0l16,95l-118,0l18,-95z"/>
   <rect id="svg_40" stroke="#261a13" fill="#3d2b1f" class="wood-dark" height="28" width="180" y="525" x="142"/>
   <line id="svg_41" stroke-width="1.8" stroke="#5bc0de" y2="525" x2="165" y1="430" x1="200"/>
   <line id="svg_42" stroke-width="1.8" stroke="#5bc0de" y2="525" x2="299" y1="430" x1="264"/>
   <text id="svg_43" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="480" x="232">Barbante Guia</text>
   <text id="svg_44" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="609" x="382">
    <tspan id="svg_45" dy="0" x="225">Estique linhas externas das extremidades (1ª e 6ª).</tspan>
    <tspan id="svg_46" dy="16" x="225">Verifique se as distâncias até as bordas da escala estão simétricas.</tspan>
   </text>
  </g>
  <g id="svg_47">
   <rect id="svg_48" x="465" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_49" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="485">4) Contorno &amp; Máscara de Proteção</text>
   <rect id="svg_50" stroke-dasharray="2,2" stroke="#b58d63" fill="#cca67c" class="area-crua" height="35" width="180" y="500" x="577"/>
   <text id="svg_51" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="521" x="667">Madeira Crua (Sem Verniz)</text>
   <rect id="svg_52" fill-opacity="0.8" stroke-width="1.5" stroke="#ded49d" fill="#fcf4cf" class="tape-mask" height="25" width="240" y="475" x="547"/>
   <rect id="svg_53" fill-opacity="0.8" stroke-width="1.5" stroke="#ded49d" fill="#fcf4cf" class="tape-mask" height="35" width="30" y="500" x="547"/>
   <rect id="svg_54" fill-opacity="0.8" stroke-width="1.5" stroke="#ded49d" fill="#fcf4cf" class="tape-mask" height="35" width="30" y="500" x="757"/>
   <rect id="svg_55" fill-opacity="0.8" stroke-width="1.5" stroke="#ded49d" fill="#fcf4cf" class="tape-mask" height="25" width="240" y="535" x="547"/>
   <text id="svg_56" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="467" x="777">Fita Crepe</text>
   <g id="svg_57">
    <path id="svg_58" opacity="0.15" fill="#d9534f" d="m522,500l10,25l-15,0l5,-25z"/>
    <text id="svg_59" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="495" x="532">Micro-escarificação</text>
   </g>
   <text id="svg_60" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="608" x="815">
    <tspan id="svg_61" dy="0" x="658">Cole a fita
     <tspan id="svg_62" font-weight="bold" fill="#d9534f" class="text-highlight">exatamente</tspan>rente à borda externa riscada.</tspan>
    <tspan id="svg_63" dy="16" x="658">Remova o brilho interno; preserve a região sem acabamento.</tspan>
   </text>
  </g>
