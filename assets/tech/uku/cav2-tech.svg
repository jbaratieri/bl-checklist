   <path id="svg_1" fill="#5c5146" d="m0,1l10,4l-10,4l0,-8z"/>
  </marker>
  <marker orient="auto-start-reverse" markerHeight="6" markerWidth="6" refY="5" refX="5" viewBox="0 0 10 10" id="arrow-alert">
   <path id="svg_2" fill="#d9534f" d="m0,1l10,4l-10,4l0,-8z"/>
  </marker>
 </defs>
 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Marcação do Cavalete — Eixo, Compensação &amp; Máscara</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text transform="matrix(0.825287 0 0 1.30294 7.86209 -18.1754)" stroke="null" id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="71" x="45">⚠️ Nota técnica: Gráficos baseados nas proporções de um Violão Clássico. Para Cavaquinho, Viola ou Ukulele, consulte as variações de offset nos blocos de textos abaixo.</text>
  <g id="svg_7">
   <rect id="svg_8" x="30" y="95" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="50">1) Alinhamento ao Eixo Central</text>
   <path id="svg_10" stroke-width="1.2" stroke="#c2996e" fill="#e5c199" opacity="0.6" class="wood-light" d="m70,305l325,0l-45,-130l-235,0l-45,130z"/>
   <circle stroke="#8c6845" id="svg_11" opacity="0.5" stroke-width="3" fill="none" class="roseta-ring" r="35" cy="162.5" cx="231"/>
   <circle id="svg_12" stroke="#8c6845" fill="#fdfaf3" r="32" cy="163" cx="230"/>
   <rect id="svg_13" stroke="#261a13" fill="#3d2b1f" class="wood-dark" height="28" width="180" y="235" x="142"/>
   <line id="svg_14" stroke-dasharray="6,4" stroke-width="1.2" stroke="#d9534f" class="linha-eixo" y2="290" x2="232" y1="145" x1="232"/>
   <text id="svg_15" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="161" x="269">Linha Central</text>
   <line id="svg_16" stroke-linecap="round" fill="#5c5146" stroke-width="1.8" stroke="#5c5146" marker-start="url(#arrow-action)" class="seta-ação" y2="249" x2="172" y1="249" x1="142"/>
   <line id="svg_17" stroke-linecap="round" fill="#5c5146" stroke-width="1.8" stroke="#5c5146" marker-start="url(#arrow-action)" class="seta-ação" y2="249" x2="292" y1="249" x1="322"/>
   <text id="svg_18" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="325" x="393">
    <tspan id="svg_19" dy="0" x="231">Trace a linha de centro com base na roseta.</tspan>
    <tspan id="svg_20" dy="16" x="231">Divida a largura do cavalete e alinhe as marcas.</tspan>
   </text>
  </g>
  <g id="svg_21">
   <rect id="svg_22" x="444" y="92" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
