    <text transform="matrix(0.866228 0 0 1 101.128 0)" stroke="null" id="svg_41" text-anchor="middle" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff" font-size="11px" class="text-badge" y="210" x="722">Pré-seladora</text>
