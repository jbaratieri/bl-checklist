   <text id="svg_69" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="608" x="397">
    <tspan id="svg_70" dy="0" x="235">Mantenha o taco plano apoiado sobre as duas superfícies.</tspan>
    <tspan id="svg_71" dy="16" x="235">Tacos moles ou inclinados arredondam e destroem os filetes.</tspan>
   </text>
