   <rect stroke="#d9534f" id="svg_47" rx="4" fill="#fff5f5" height="25" width="371.00001" y="240" x="484.99999"/>
   <text id="svg_48" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="257" x="670">⚠️ ATENÇÃO: Pular grãos gera riscos profundos sob o verniz!</text>
   <text id="svg_49" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="318" x="816">
