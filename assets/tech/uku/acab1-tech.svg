    <tspan id="svg_89" dy="0" x="674">Use uma lâmpada lateral rasante para localizar brilhos de cola.</tspan>
    <tspan id="svg_90" dy="16" x="674">Remova com raspilha ou formão plano antes de selar a madeira.</tspan>
