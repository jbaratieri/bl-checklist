    <text id="svg_60" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="464" x="131">Taco Rígido e Largo</text>
    <text id="svg_61" font-weight="bold" fill="#2b7042" font-size="11px" class="text-ok" y="552" x="92">✔️ CORRETO</text>
