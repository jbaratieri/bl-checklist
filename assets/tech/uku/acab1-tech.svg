 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Lixamento Progressivo — Nivelamento, Direção de Fibra e Bordas</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text transform="matrix(0.902554 0 0 1.07769 4.38506 -4.62565)" stroke="null" id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Nota de segurança: Sempre lixe a favor das fibras. Use máscara PFF2/P2 para pó fino e verifique o limite do grão ideal para cada instrumento nos callouts.</text>
  <g id="svg_7">
