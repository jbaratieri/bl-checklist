    <text id="svg_18" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="205" x="230">Grafite (Revela depressões)</text>
   </g>
   <line id="svg_19" marker-end="url(#arrow-action)" class="seta-action" y2="270" x2="320" y1="270" x1="140"/>
   <text id="svg_20" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="288" x="230">Passadas longas e retas com a fibra</text>
   <text id="svg_21" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="314" x="396">
