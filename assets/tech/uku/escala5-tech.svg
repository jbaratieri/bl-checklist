   <text id="svg_51" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="502" x="380">Gota CA</text>
   <text id="svg_52" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="600" x="232">Assente do centro para as pontas. Fixe extremidades com CA.</text>
