<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
   <path d="m10,1l-10,4l10,4l0,-8z" fill="#d9534f" id="svg_1"/>
  </marker>
  <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
   <path d="m0,1l10,4l-10,4l0,-8z" fill="#d9534f" id="svg_2"/>
  </marker>
 </defs>
 <g>
  <title>Layer 1</title>
  <rect width="900" height="700" class="bg-canvas" fill="#fdfaf3" id="svg_4"/>
  <text x="30" y="40" class="text-main-title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#4a3e3d" id="svg_5">Ajuste de Pestana (Nut) — Geometria, Espaçamento e Vetores de Escoamento</text>
  <rect x="30" y="52" width="840" height="28" fill="#fff7eb" stroke="#f0ad4e" rx="4" id="svg_6"/>
  <text x="45" y="70" class="text-note" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-style="italic" fill="#a06000" font-weight="bold" id="svg_7">⚠️ Regra de Ouro: O ponto de apoio da corda deve terminar no limite exato da escala, evitando erros de afinação nas casas iniciais.</text>
  <g id="svg_8">
   <rect width="405" height="260" class="bg-panel" fill="#ffffff" stroke="#c8bca6" stroke-width="1.5" rx="8" y="95" x="30" id="svg_9"/>
   <text x="50" y="125" class="text-step-title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#5c5146" id="svg_10">1) Espaçamento Proporcional (Mão Esquerda)</text>
   <g id="svg_11">
    <rect x="75" y="185" width="310" height="40" class="bone-nut" rx="2" fill="#fcfbf7" stroke="#a39b8c" stroke-width="1.5" id="svg_12"/>
    <line x1="100" y1="175" x2="100" y2="235" class="guide-line" stroke="#a39b8c" stroke-dasharray="3,3" fill="none" id="svg_13"/>
    <line x1="385" y1="175" x2="385" y2="235" class="guide-line" stroke="#a39b8c" stroke-dasharray="3,3" fill="none" id="svg_14"/>
    <line x1="360" y1="175" x2="360" y2="235" class="guide-line" stroke="#a39b8c" stroke-dasharray="3,3" fill="none" id="svg_15"/>
    <path d="m75,170l25,0" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" stroke="#d9534f" stroke-width="1.2" fill="none" id="svg_16"/>
    <text x="87.5" y="165" class="text-label" font-size="12px" font-weight="bold" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" id="svg_17">3.0 – 3.5 mm</text>
    <circle cx="100" cy="205" r="4.5" fill="#9da3ab" id="svg_18"/>
    <circle cx="152" cy="205" r="3.8" fill="#9da3ab" id="svg_19"/>
    <circle cx="204" cy="205" r="3.2" fill="#9da3ab" id="svg_20"/>
    <circle cx="256" cy="205" r="2.6" fill="#111111" id="svg_21"/>
    <circle cx="308" cy="205" r="2" fill="#111111" id="svg_22"/>
    <circle cx="360" cy="205" r="1.5" fill="#111111" id="svg_23"/>
    <path d="m100,240l260,0" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" stroke="#d9534f" stroke-width="1.2" fill="none" id="svg_24"/>
    <text x="230" y="255" class="text-label" font-size="12px" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" text-anchor="middle" id="svg_25">E–E Clássico: 43 – 45 mm</text>
    <text fill="#6b5b52" stroke="null" x="117.99999" y="268.39998" id="svg_82" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" xml:space="preserve">Outros instrumentos, de acorco com o projeto</text>
   </g>
   <text x="390" y="313" class="text-label" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" fill="#6b5b52" id="svg_26">
    <tspan x="218" dy="0" id="svg_27">A distribuição por folgas/gaps iguais compensa as</tspan>
    <tspan x="218" dy="16" id="svg_28">espessuras diferentes dos bordões e garante o equilíbrio tátil.</tspan>
   </text>
  </g>
  <g id="svg_29">
   <rect width="405" height="260" class="bg-panel" fill="#ffffff" stroke="#c8bca6" stroke-width="1.5" rx="8" y="96" x="465" id="svg_30"/>
   <text x="485" y="126" class="text-step-title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#5c5146" id="svg_31">2) Ângulo de Quebra e Ponto Zero de Apoio</text>
   <g id="svg_32">
    <path d="m625,236l200,0l0,40l-200,0l0,-40z" class="wood-neck" fill="#d4a373" stroke="#a67c52" stroke-width="1.2" id="svg_33"/>
    <path d="m625,236l-120,-45l0,40l120,45l0,-40z" class="wood-neck" fill="#d4a373" stroke="#a67c52" stroke-width="1.2" id="svg_34"/>
    <rect x="625" y="226" width="200" height="10" class="wood-fretboard" fill="#4a3b32" stroke="#2b221e" id="svg_35"/>
    <path d="m615,206l10,0l0,30l-10,0l0,-30z" class="bone-nut" fill="#fcfbf7" stroke="#a39b8c" stroke-width="1.5" id="svg_36"/>
    <path d="m505,176l115,32l205,0" class="string-line" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" id="svg_37"/>
    <path d="m565,208a60,60 0 0 1 55,0" fill="none" stroke="#2b7042" stroke-dasharray="2,2" id="svg_38"/>
    <path d="m505,176l60,17" fill="none" stroke="#2b7042" stroke-width="1.5" id="svg_39"/>
    <path d="m575,190l-5,7" fill="none" stroke="#d9534f" marker-end="url(#arrow-end)" id="svg_40"/>
    <text x="560" y="184" class="text-highlight" font-size="11px" fill="#d9534f" font-weight="bold" id="svg_41">12° – 18°</text>
   </g>
   <text x="843" y="314" class="text-label" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" fill="#6b5b52" id="svg_42">
    <tspan x="671" dy="0" id="svg_43">O canal deve descer inclinado em direção às tarraxas.</tspan>
    <tspan x="671" dy="16" id="svg_44">Canais paralelos à escala criam o ruído indesejado de "sitar".</tspan>
   </text>
  </g>
  <g id="svg_45">
   <rect width="405" height="260" class="bg-panel" fill="#ffffff" stroke="#c8bca6" stroke-width="1.5" rx="8" y="386" x="30" id="svg_46"/>
   <text x="50" y="416" class="text-step-title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#5c5146" id="svg_47">3) Calibragem e Profundidade do Canal</text>
   <g id="svg_48">
    <path d="m130,536l0,-50c40,0 60,15 100,15l100,0c40,0 60,-15 100,-15l0,50l-300,0z" class="bone-nut" fill="#fcfbf7" stroke="#a39b8c" stroke-width="1.5" id="svg_49"/>
    <path d="m212,501a18,18 0 0 0 36,0" fill="#fdfaf3" stroke="#a39b8c" stroke-width="1.5" id="svg_50"/>
    <circle cx="230" cy="501" r="17.5" class="string-core" stroke-width="1.5" fill="none" stroke="#9da3ab" id="svg_51"/>
    <line x1="205" y1="501" x2="255" y2="501" class="guide-line" stroke="#a39b8c" stroke-dasharray="3,3" fill="none" id="svg_52"/>
    <path d="m255,483l0,18" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" stroke="#d9534f" stroke-width="1.2" fill="none" id="svg_53"/>
    <text x="290" y="494" class="text-label" font-size="12px" font-weight="bold" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" id="svg_54">~50% Livre</text>
    <path d="m210,514l18,0" class="dimension-line" marker-end="url(#arrow-end)" stroke="#d9534f" stroke-width="1.2" fill="none" id="svg_55"/>
    <text x="195" y="528" class="text-label" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" text-anchor="middle" id="svg_56">+ 0.03 mm</text>
   </g>
   <text x="411" y="591" class="text-label" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" fill="#6b5b52" id="svg_57">
    <tspan x="239" dy="0" id="svg_58">Canais profundos demais aprisionam e travam a corda,</tspan>
    <tspan x="239" dy="16" id="svg_59">gerando estalos mecânicos agudos durante a afinação.</tspan>
   </text>
  </g>
  <g id="svg_60">
   <rect width="405" height="260" class="bg-panel" fill="#ffffff" stroke="#c8bca6" stroke-width="1.5" rx="8" y="385" x="465" id="svg_61"/>
   <text x="485" y="415" class="text-step-title" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#5c5146" id="svg_62">4) Alvos Metrológicos Sobre o 1º Traste</text>
   <g id="svg_63">
    <rect x="505" y="515" width="320" height="15" class="wood-fretboard" fill="#4a3b32" stroke="#2b221e" id="svg_64"/>
    <path d="m665,515c0,-20 20,-20 20,0l-20,0z" class="fret-wire" fill="#b0b5bc" stroke="#787d82" id="svg_65"/>
    <text x="675" y="527" class="text-label" font-size="12px" fill="#cccccc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" id="svg_66">1º Traste</text>
    <line x1="505" y1="485" x2="825" y2="485" class="string-line" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" id="svg_67"/>
    <path d="m675,487l0,16" class="dimension-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" stroke="#d9534f" stroke-width="1.2" fill="none" id="svg_68"/>
    <g id="svg_69">
     <rect width="130" height="42" fill="#f4f9f5" stroke="#2b7042" rx="4" y="431" x="516" id="svg_70"/>
     <text x="547" y="446" class="text-ok" font-size="11px" font-weight="bold" fill="#2b7042" id="svg_71">Nylon Clássico</text>
     <text x="581" y="463" class="text-label" font-size="12px" font-weight="bold" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" id="svg_72">E1: 0.45 / E6: 0.70mm</text>
    </g>
    <g id="svg_73">
     <rect width="130" height="42" fill="#f4f9f5" stroke="#2b7042" rx="4" y="429" x="681" id="svg_74"/>
     <text x="712" y="447" class="text-ok" font-size="11px" font-weight="bold" fill="#2b7042" id="svg_75">Aço / Cavaco</text>
     <text x="746" y="461" class="text-label" font-size="12px" font-weight="bold" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" id="svg_76">0.35 – 0.50 mm</text>
    </g>
   </g>
   <text x="844" y="601" class="text-label" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" fill="#6b5b52" id="svg_77">
    <tspan x="677" dy="0" id="svg_78">Pressione a corda na 3ª casa e verifique visualmente</tspan>
    <tspan x="677" dy="16" id="svg_79">se resta uma folga mínima (luz) sobre o topo do 1º traste.</tspan>
   </text>
  </g>
 </g>
</svg>