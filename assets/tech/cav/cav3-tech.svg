   <text id="svg_57" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" class="text-label" y="533" x="541">Interior da Caixa</text>
   <text id="svg_58" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="530" x="665">Boca</text>
   <rect id="svg_59" stroke="#261a13" fill="#3d2b1f" class="wood-dark" height="14" width="95" y="496" x="715"/>
   <circle id="svg_60" opacity="0.9" stroke-width="0.8" stroke="#f0ad4e" fill="#f0ad4e" class="glue-layer" r="2" cy="510" cx="714"/>
   <circle id="svg_61" opacity="0.9" stroke-width="0.8" stroke="#f0ad4e" fill="#f0ad4e" class="glue-layer" r="2" cy="510" cx="811"/>
   <rect id="svg_62" stroke-width="1.2" stroke="#a98467" fill="#d4a373" class="wood-tool" height="16" width="105" y="475" x="710"/>
   <text id="svg_63" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="487" x="762">Taco Superior</text>
   <rect id="svg_64" stroke-width="1.2" stroke="#a98467" fill="#d4a373" class="wood-tool" height="14" width="220" y="521" x="595"/>
   <text id="svg_65" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="532" x="762">Taco Interno</text>
   <path id="svg_66" marker-end="url(#arrow-action)" stroke-width="1.2" stroke="#5c5146" fill="none" d="m610,540l30,0"/>
   <text id="svg_67" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold" font-size="12px" class="text-label" y="553" x="605">Inserção do apoio interno</text>
   <line id="svg_68" stroke-linecap="round" fill="#d9534f" stroke-width="2.5" stroke="#d9534f" marker-end="url(#arrow-pressure)" class="seta-força" y2="467" x2="762" y1="443" x1="762"/>
   <line id="svg_69" stroke-linecap="round" fill="#d9534f" stroke-width="2.5" stroke="#d9534f" marker-end="url(#arrow-pressure)" class="seta-força" y2="543" x2="762" y1="567" x1="762"/>
   <text id="svg_70" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="605" x="825">
    <tspan id="svg_71" dy="0" x="668">O taco interno protege contra a flexão do tampo.</tspan>
    <tspan id="svg_72" dy="16" x="668">
     <tspan id="svg_73" font-weight="bold" fill="#d9534f" class="text-highlight">Cuidado:</tspan>Pressão excessiva pode trincar a estrutura.</tspan>
   </text>
