 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Colagem do Cavalete — Montagem do Sanduíche de Prensagem</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text transform="matrix(0.833917 0 0 1 7.47372 0)" stroke="null" id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Nota técnica: Gráficos baseados nas proporções de um Violão Clássico. Para Cavaquinho, Viola ou Ukulele, consulte a rigidez do bracing interno descrita nos callouts.</text>
  <g id="svg_7">
   <rect id="svg_8" x="30" y="95" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="50">1) Preparação Física das Superfícies</text>
   <rect id="svg_10" stroke="#261a13" fill="#3d2b1f" class="wood-dark" height="40" width="250" y="205" x="105"/>
   <path id="svg_11" opacity="0.4" stroke-width="0.8" stroke="#ffffff" d="m115,210l20,30m0,-30l-20,30m40,-30l20,30m0,-30l-20,30m40,-30l20,30m0,-30l-20,30m40,-30l20,30m0,-30l-20,30m40,-30l20,30m0,-30l-20,30m40,-30l20,30m0,-30l-20,30"/>
   <text id="svg_12" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="187" x="230">Micro-hachuras (X) com estilete/formão</text>
   <g id="svg_13">
    <line id="svg_14" stroke-width="3" stroke="#78828c" y2="285" x2="226" y1="245" x1="226"/>
    <path id="svg_15" fill="#555" d="m222,285l8,0l-4,6l-4,-6z"/>
    <text id="svg_16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#6b5b52" font-size="12px" class="text-label" y="270" x="291">Limpeza manual furos</text>
   </g>
   <text id="svg_17" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="314" x="370">
    <tspan id="svg_18" dy="0" x="213">Limpe os resíduos dos furos e remova a máscara antiga.</tspan>
    <tspan id="svg_19" dy="16" x="213">Crie ranhuras cruzadas para maximizar a ancoragem da cola.</tspan>
   </text>
  </g>
  <g id="svg_20">
