   <text id="svg_22" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="485">2) Alinhamento e Moldura Antideslize</text>
   <line id="svg_23" stroke-dasharray="6,4" stroke-width="1.2" stroke="#d9534f" class="linha-eixo" y2="290" x2="667" y1="140" x1="667"/>
   <rect id="svg_24" stroke-width="1.2" stroke="#ded49d" fill="#fcf4cf" opacity="0.4" class="tape-mask" height="70" width="205" y="190" x="565"/>
   <rect id="svg_25" stroke-dasharray="2,2" stroke="#d9534f" fill="#ffffff" height="30" width="180" y="210" x="577"/>
   <text id="svg_26" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="180" x="667">Fita Crepe (Controle de Squeeze-out)</text>
   <g id="svg_27">
    <rect stroke="#f0ad4e" id="svg_28" x="588" y="214" opacity="0.9" stroke-width="0.8" fill="#f0ad4e" rx="2" class="glue-layer" height="15" width="159"/>
    <text transform="matrix(0.91087 0 0 0.926845 59.045 15.7938)" stroke="null" id="svg_29" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="227" x="668">Filme contínuo e fino de cola</text>
   </g>
   <text id="svg_30" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="316" x="809">
    <tspan id="svg_31" dy="0" x="652">Proteja o entorno com fita rente à área de colagem.</tspan>
    <tspan id="svg_32" dy="16" x="652">A fita serve de barreira física contra o deslize do cavalete.</tspan>
   </text>
  </g>
  <g id="svg_33">
