   <text id="svg_35" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="50">3) Sequência Manual de Prensagem</text>
   <path id="svg_36" stroke="#261a13" fill="#3d2b1f" class="wood-dark" d="m90,535l50,0l0,-25l180,0l0,25l50,0l0,-8l-50,-7l0,-10m-180,0l0,10l-50,7l50,-17z"/>
   <line id="svg_37" stroke-linecap="round" fill="#d9534f" stroke-width="2.5" stroke="#d9534f" marker-end="url(#arrow-pressure)" class="seta-força" y2="495" x2="230" y1="435" x1="230"/>
   <circle id="svg_38" fill="#d9534f" r="10" cy="435" cx="230"/>
   <text id="svg_39" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-badge" y="439" x="230">1</text>
   <text id="svg_40" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="505" x="230">CENTRO</text>
   <line id="svg_41" stroke-linecap="round" fill="#d9534f" stroke-width="2.5" marker-end="url(#arrow-pressure)" stroke="#d9534f" class="seta-força" y2="515" x2="120" y1="450" x1="120"/>
   <circle id="svg_42" fill="#5c5146" r="10" cy="450" cx="120"/>
   <text id="svg_43" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-badge" y="454" x="120">2</text>
   <line id="svg_44" stroke-linecap="round" fill="#d9534f" stroke-width="2.5" marker-end="url(#arrow-pressure)" stroke="#d9534f" class="seta-força" y2="515" x2="340" y1="450" x1="340"/>
   <circle id="svg_45" fill="#5c5146" r="10" cy="450" cx="340"/>
   <text id="svg_46" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="11px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-badge" y="454" x="340">3</text>
   <text id="svg_47" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-style="italic" font-size="12px" class="text-label" y="557" x="230">Aperte do centro para as extremidades (aletas)</text>
   <text id="svg_48" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="597" x="376">
    <tspan id="svg_49" dy="0" x="219">Fixe primeiro o grampo central estabilizador.</tspan>
    <tspan id="svg_50" dy="16" x="219">Feche as laterais controlando o refluxo da cola (squeeze-out).</tspan>
   </text>
  </g>
  <g id="svg_51">
   <rect id="svg_52" x="465" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_53" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="485">4) Vista de Corte Interno (Boca do Instrumento)</text>
   <rect id="svg_54" stroke-width="1.2" stroke="#c2996e" fill="#e5c199" class="wood-light" height="6" width="130" y="510" x="505"/>
   <rect id="svg_55" opacity="0.3" fill="#fdfaf3" height="6" width="65" y="510" x="635"/>
