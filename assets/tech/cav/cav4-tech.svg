<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <marker orient="auto-start-reverse" markerHeight="6" markerWidth="6" refY="5" refX="5" viewBox="0 0 10 10" id="arrow-action">
   <path id="svg_1" fill="#5c5146" d="m0,1l10,4l-10,4l0,-8z"/>
  </marker>
  <marker orient="auto-start-reverse" markerHeight="6" markerWidth="6" refY="5" refX="5" viewBox="0 0 10 10" id="arrow-alert">
   <path id="svg_2" fill="#d9534f" d="m0,1l10,4l-10,4l0,-8z"/>
  </marker>
 </defs>
 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Confecção do Rastilho — Ajuste, Ângulo e Perfil de Oitava</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text transform="matrix(0.844875 0 0 1.0756 6.98062 -4.47923)" stroke="null" id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Nota técnica: Gráficos baseados nas proporções de Nylon (Clássico). Para Cavaquinho (aço) e Ukulele, observe as micro-rampas e compensações descritas no app.</text>
  <g id="svg_7">
   <rect id="svg_8" x="30" y="95" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="50">1) Espessura Justa e Base Plana</text>
   <path id="svg_10" stroke="#261a13" fill="#3d2b1f" class="wood-dark" d="m100,265l90,0l0,-60l35,0l0,60l140,0l0,25l-265,0l0,-25z"/>
   <rect id="svg_11" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" height="75" width="29" y="170" x="193"/>
   <line id="svg_12" stroke-width="2.5" stroke="#4cd964" y2="245" x2="222" y1="245" x1="193"/>
   <line id="svg_13" stroke-linecap="round" fill="#5c5146" stroke-width="1.8" stroke="#5c5146" marker-end="url(#arrow-action)" class="seta-ação" y2="190" x2="188" y1="190" x1="175"/>
   <line id="svg_14" stroke-linecap="round" fill="#5c5146" stroke-width="1.8" stroke="#5c5146" marker-end="url(#arrow-action)" class="seta-ação" y2="190" x2="230" y1="190" x1="243"/>
   <text id="svg_15" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="176" x="151">Ajuste Justo</text>
   <line id="svg_16" stroke-width="1.2" stroke="#d9534f" class="linha-medida" y2="278" x2="240" y1="278" x1="180"/>
   <text id="svg_17" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="246" x="288">Base 100% Plana</text>
   <text id="svg_18" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="320" x="382">
    <tspan id="svg_19" dy="0" x="220">Ajuste a espessura até entrar sob leve pressão.</tspan>
    <tspan id="svg_20" dy="16" x="220">Lixe a base em vidro plano para evitar perda de volume.</tspan>
   </text>
  </g>
  <g id="svg_21">
   <rect id="svg_22" x="465" y="95" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_23" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="485">2) Relação Altura x Ação na 12ª Casa</text>
   <path id="svg_24" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" d="m525,245l280,0l0,-40c-70,-10 -210,-5 -280,10l0,30z"/>
   <path id="svg_25" stroke-dasharray="4,3" stroke="#78828c" class="linha-guia" d="m525,230c70,-15 210,-20 280,-10"/>
   <line id="svg_26" stroke-width="1.2" stroke="#d9534f" class="linha-medida" y2="220" x2="820" y1="205" x1="820"/>
   <line id="svg_27" stroke="#d9534f" y2="205" x2="825" y1="205" x1="815"/>
   <line id="svg_28" stroke="#d9534f" y2="220" x2="825" y1="220" x1="815"/>
   <rect id="svg_29" rx="4" stroke="#6c757d" fill="#f8f9fa" height="30" width="205" y="150" x="565"/>
   <text id="svg_30" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-size="12px" font-weight="bold" class="text-label" y="169" x="667">Δ Rastilho = 2 × Δ Ação (12ª)</text>
   <text id="svg_31" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="238" x="675">Margem de Remoção</text>
   <text id="svg_32" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="320" x="811">
    <tspan id="svg_33" dy="0" x="654">Para baixar 0.5 mm na ação das cordas da 12ª casa,</tspan>
    <tspan id="svg_34" dy="16" x="654">será necessário desbastar 1.0 mm na base do rastilho.</tspan>
   </text>
  </g>
  <g id="svg_35">
   <rect id="svg_36" x="30" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_37" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="50">3) Crista Coroada &amp; Ângulo de Quebra</text>
   <path id="svg_38" stroke="#261a13" fill="#3d2b1f" class="wood-dark" d="m90,565l100,0l0,-50l50,0l0,50l130,0l0,20l-280,0l0,-20z"/>
   <path id="svg_39" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" d="m195,515l0,-35c0,-5 15,-13 20,-13c10,0 20,13 20,13l0,35l-40,0z"/>
   <line id="svg_40" fill="none" stroke-width="2" stroke="#acb6bf" class="string-line" y2="467" x2="215" y1="460" x1="70"/>
   <line id="svg_41" fill="none" stroke-width="2" stroke="#acb6bf" class="string-line" y2="545" x2="290" y1="467" x1="215"/>
   <circle id="svg_42" stroke="#3d2b1f" fill="#8c6845" r="4" cy="545" cx="290"/>
   <path id="svg_43" stroke-dasharray="3,2" stroke-width="1.2" stroke="#d9534f" fill="none" d="m245,480c20,20 25,35 30,50"/>
   <text id="svg_44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-size="12px" font-weight="bold" fill="#6b5b52" class="text-label" y="495" x="280">Quebra: 12° a 15°</text>
   <line id="svg_45" fill="#d9534f" stroke-width="1.5" stroke="#d9534f" marker-end="url(#arrow-alert)" class="seta-alerta" y2="461" x2="215" y1="437" x1="215"/>
   <text id="svg_46" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="430" x="215">Crista Estreita (~1mm)</text>
   <text id="svg_47" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="611" x="387">
    <tspan id="svg_48" dy="0" x="225">Arredonde o topo ("coroamento") sem deixar planos.</tspan>
    <tspan id="svg_49" dy="16" x="225">O ângulo de quebra correto impede ruídos e zumbidos.</tspan>
   </text>
  </g>
  <g id="svg_50">
   <rect id="svg_51" x="465" y="385" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_52" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="415" x="485">4) Perfil de Crista e Compensação de Oitava</text>
   <g id="svg_53">
    <path id="svg_54" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" d="m525,505l0,-35c0,-10 25,-15 30,-15l0,50l-30,0z"/>
    <circle id="svg_55" fill="#d9534f" r="3" cy="457" cx="552"/>
    <line id="svg_56" fill="#d9534f" stroke-width="1.5" stroke="#d9534f" marker-end="url(#arrow-alert)" class="seta-alerta" y2="456" x2="553" y1="450" x1="560"/>
    <text id="svg_57" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="445" x="570">Recuo Máximo</text>
    <text id="svg_58" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="520" x="540">Graves (E/6ª)</text>
   </g>
   <g id="svg_59">
    <path id="svg_60" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" d="m650,505l0,-35c0,-10 15,-15 15,-15c0,0 15,5 15,15l0,35l-30,0z"/>
    <circle id="svg_61" fill="#5c5146" r="3" cy="455" cx="665"/>
    <text id="svg_62" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="520" x="665">Centro</text>
   </g>
   <g id="svg_63">
    <path id="svg_64" stroke-width="1.5" stroke="#b5ad9e" fill="#fcfaf2" class="bone-saddle" d="m775,505l0,-50c5,0 30,5 30,15l0,35l-30,0z"/>
    <circle id="svg_65" fill="#269abc" r="3" cy="457" cx="778"/>
    <line id="svg_66" marker-end="url(#arrow-action)" class="seta-action" y2="456" x2="776" y1="450" x1="767"/>
    <text id="svg_67" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="445" x="763">Avanço</text>
    <text id="svg_68" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="520" x="790">Agudas (E/1ª)</text>
   </g>
   <text id="svg_69" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="598" x="827">
    <tspan id="svg_70" dy="0" x="670">Molde a crista do osso para frente ou para trás.</tspan>
    <tspan id="svg_71" dy="16" x="670">Isso corrige pequenos desvios de oitava na afinação.</tspan>
   </text>
  </g>
 </g>
</svg>