     <path id="svg_37" stroke-width="1.5" stroke="#b5ad9e" fill="#eae5db" class="munequilla" d="m547,190c0,-25 36,-25 36,0c0,5 -6,15 -18,15c-12,0 -18,-10 -18,-15z"/>
     <path id="svg_38" stroke-width="1.5" stroke="#b5ad9e" fill="none" d="m559,168q6,-8 12,0"/>
     <text id="svg_39" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="194" x="565">Pano Fino</text>
    </g>
    <path id="svg_40" fill="#5bc0de" d="m665,145q3,8 0,12q-3,-4 0,-12z"/>
    <text id="svg_41" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="153" x="710">1 gota de óleo mineral</text>
   </g>
   <text id="svg_42" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="320" x="826">
    <tspan id="svg_43" dy="0" x="669">Mantenha a boneca em movimento constante ao tocar a madeira.</tspan>
    <tspan id="svg_44" dy="16" x="669">Parar o acessório sobre o tampo queima e derrete as camadas anteriores.</tspan>
   </text>
  </g>
  <g id="svg_45">
