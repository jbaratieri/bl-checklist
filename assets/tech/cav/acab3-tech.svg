     <text id="svg_57" text-anchor="middle" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff" font-size="11px" class="text-badge" y="490" x="181">Refino de Riscos</text>
