   <rect stroke="#f0ad4e" id="svg_69" rx="4" fill="#fffcf0" height="26" width="390.00002" y="530" x="35.99999"/>
   <text transform="matrix(0.916603 0 0 0.84912 18.348 82.7803)" stroke="null" id="svg_70" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="546" x="232">⚠️ Atenção com arestas e cantos: A lixa atravessa o verniz facilmente!</text>
   <text id="svg_71" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="606" x="392">
