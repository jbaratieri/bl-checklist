     <text id="svg_52" text-anchor="middle" font-weight="bold" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff" font-size="11px" class="text-badge" y="490" x="95">Corte Úmido</text>
    </g>
    <path id="svg_53" marker-end="url(#arrow-action)" stroke-width="1.2" stroke="#5c5146" fill="none" d="m133,475l10,0"/>
