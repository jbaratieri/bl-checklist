 <g>
  <title>Layer 1</title>
  <rect id="svg_3" fill="#fdfaf3" class="bg-canvas" height="700" width="900"/>
  <text id="svg_4" fill="#4a3e3d" font-weight="bold" font-size="20px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-main-title" y="40" x="30">Acabamento Final — Arquitetura de Camadas, Polimento e Ambiente</text>
  <rect id="svg_5" rx="4" stroke="#f0ad4e" fill="#fff7eb" height="28" width="840" y="52" x="30"/>
  <text id="svg_6" font-weight="bold" fill="#a06000" font-style="italic" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-model-note" y="70" x="45">⚠️ Controle Crítico: Filmes excessivamente espessos abafam o ataque acústico. Monitore as micras aplicadas em cada etapa.</text>
  <g id="svg_7">
   <rect id="svg_8" x="24" y="95" rx="8" stroke-width="1.5" stroke="#c8bca6" fill="#ffffff" class="bg-panel" height="260" width="405"/>
   <text id="svg_9" fill="#5c5146" font-weight="bold" font-size="16px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" class="text-step-title" y="125" x="50">1) Espessura Alvo do Filme (Micromotoria)</text>
   <g id="svg_10">
    <rect id="svg_11" stroke="#c2996e" fill="#f2d1a9" class="wood-base" height="35" width="160" y="230" x="70"/>
