     <circle id="svg_67" stroke="#b5ad9e" fill="#ebeeec" r="8" cy="473" cx="352"/>
     <text id="svg_68" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="498" x="352">BRILHO 100%</text>
    </g>
