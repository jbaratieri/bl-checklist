    <rect id="svg_19" stroke="#f0ad4e" fill-opacity="0.3" fill="#f0ad4e" class="layer-seal" height="15" width="140" y="215" x="260"/>
    <rect id="svg_20" stroke="#46b8da" fill-opacity="0.25" fill="#5bc0de" class="layer-build" height="30" width="140" y="185" x="260"/>
    <rect id="svg_21" stroke-width="1.2" stroke="#269abc" fill-opacity="0.45" fill="#5bc0de" class="layer-top" height="20" width="140" y="165" x="260"/>
    <text id="svg_22" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#6b5b52" font-weight="bold" font-size="12px" class="text-label" y="198" x="330">Nitro / PU: 80–120 µm</text>
   </g>
   <rect stroke="#d9534f" id="svg_23" rx="4" stroke-width="0.8" fill="#fff5f5" height="24" width="385.99999" y="280" x="29.00001"/>
   <text transform="matrix(0.935492 0 0 1 27.966 0)" stroke="null" id="svg_24" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="296" x="207.414">⚠️ Acima de 150 µm o filme cristalizado aprisiona a resposta acústica.</text>
   <text id="svg_25" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="328" x="391">
