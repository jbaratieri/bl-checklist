    <text id="svg_79" font-weight="bold" fill="#2b7042" font-size="16px" class="text-ok" y="479" x="557">18 – 25 °C</text>
    <text transform="matrix(0.848823 0 0 1 90.2066 0)" stroke="null" id="svg_80" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="499" x="590">Temperatura de Trabalho</text>
    <rect id="svg_81" rx="6" stroke-width="1.2" stroke="#2b7042" fill="#f4f9f5" height="55" width="140" y="460" x="675"/>
    <text id="svg_82" font-weight="bold" fill="#2b7042" font-size="16px" class="text-ok" y="478" x="712">40 – 60 %</text>
    <text id="svg_83" text-anchor="middle" fill="#6b5b52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" font-size="12px" class="text-label" y="499" x="745">Umidade Relativa (UR)</text>
   </g>
   <rect stroke="#d9534f" id="svg_84" rx="4" fill="#fff5f5" height="26" width="386" y="530" x="476"/>
   <text id="svg_85" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="bold" fill="#6b5b52" font-size="12px" class="text-label" y="546" x="667">⚠️ UR acima de 70% causa "Blush" (Verniz esbranquiçado/opaco)</text>
   <text id="svg_86" fill="#6b5b52" font-size="12px" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" class="text-label" y="607" x="823">
    <tspan id="svg_87" dy="0" x="666">Respeite rigorosamente a cura total (Nitro: 2–4 sem; PU: 7–14 dias).</tspan>
    <tspan id="svg_88" dy="16" x="666">Tensionar as cordas antes do prazo causa o afundamento do cavalete.</tspan>
   </text>
